name: Thrace dataset validation

on:
  pull_request:
    paths:
      - "scripts/build_thrace_fire_dataset.py"
      - "scripts/evaluate_thrace_dataset.py"
      - "backend/tests/test_thrace_dataset_builder.py"
      - "backend/tests/test_thrace_evaluation_metrics.py"
      - ".github/workflows/thrace-dataset-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_thrace_fire_dataset.py"
      - "scripts/evaluate_thrace_dataset.py"
      - "backend/tests/test_thrace_dataset_builder.py"
      - "backend/tests/test_thrace_evaluation_metrics.py"
      - ".github/workflows/thrace-dataset-validation.yml"

jobs:
  dataset-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests scikit-learn
      - name: Compile dataset tools
        run: python -m py_compile scripts/build_thrace_fire_dataset.py scripts/evaluate_thrace_dataset.py
      - name: Run dataset unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/tests/test_thrace_dataset_builder.py backend/tests/test_thrace_evaluation_metrics.py
