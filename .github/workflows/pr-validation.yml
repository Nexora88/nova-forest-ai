name: PR validation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check changed JavaScript syntax
        run: |
          node --check js/field-events.js
          node --check js/i18n.js
          node --check js/mobile-nav.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest playwright

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

      - name: Run responsive bilingual browser smoke tests
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/e2e/test_mobile_ui.py -q
