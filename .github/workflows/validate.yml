name: Validate NexoraWildfire AI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and ML dependencies
        run: python -m pip install --upgrade pip -r backend/requirements.txt pytest httpx
      - name: Train research model from the official UCI dataset
        run: python backend/scripts/train_uci_research_model.py
      - name: Compile backend Python sources
        run: python -m compileall -q backend/app backend/scripts scripts
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Test opt-in cloud export privacy safeguards
        run: python tests/test_cloud_export_gcs.py
      - name: Validate local HTML links and asset references
        run: python scripts/validate_web_assets.py
      - name: Test security and scientific-disclosure contracts
        run: python -m pytest -q tests/test_security_contracts.py
      - name: Check JavaScript syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium test runner
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Test bilingual controls, mobile menu, desktop menu, and install lifecycle
        run: python tests/e2e/test_mobile_ui.py

  provider-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install --upgrade requests
      - name: Probe current production provider credentials without exposing secrets
        run: |
          python - <<'PY'
          import json
          import requests

          base = "https://nova-forest-ai.vercel.app/api"

          try:
              health = requests.get(base + "/health", timeout=20)
              print("Production backend health HTTP:", health.status_code)
              if not health.ok:
                  print("Backend health endpoint did not return success; provider results are unverified.")
                  raise SystemExit(0)
          except requests.RequestException as exc:
              print("Production backend unavailable:", type(exc).__name__)
              raise SystemExit(0)

          try:
              live_response = requests.get(base + "/satellite/live-check", timeout=75)
              print("Live provider diagnostic HTTP:", live_response.status_code)
              if live_response.ok:
                  live = live_response.json()
                  firms = live.get("nasa_firms", {})
                  catalog = live.get("sentinel2_catalog", {})
                  processing = live.get("sentinel2_processing", {})
                  print("NASA FIRMS status:", firms.get("status", "unknown"))
                  print("NASA FIRMS observations returned:", firms.get("alert_count", "not reported"))
                  print("Copernicus STAC catalog:", catalog.get("status", "unknown"))
                  print("Copernicus credential configuration:", processing.get("status", "unknown"))
              else:
                  print("Live provider diagnostic returned a non-success response; no credentials or response body were printed.")
          except (requests.RequestException, ValueError) as exc:
              print("Live provider diagnostic failed:", type(exc).__name__)

          try:
              credentials = requests.get(base + "/satellite/providers/status", params={"probe": "true"}, timeout=45)
              print("Provider credential validation HTTP:", credentials.status_code)
              if credentials.ok:
                  status = credentials.json().get("providers", {})
                  for provider in ("nasa_firms", "copernicus_sentinel_hub", "open_meteo"):
                      item = status.get(provider, {})
                      print(provider, "credential/provider status:", item.get("status", "unknown"))
                      print(provider, "secret exposed:", bool(item.get("secret_exposed", False)))
              else:
                  print("Provider credential validation unavailable; response body omitted.")
          except (requests.RequestException, ValueError) as exc:
              print("Provider credential validation failed:", type(exc).__name__)

          geometry = {
              "type": "Polygon",
              "coordinates": [[
                  [-122.40, 38.35], [-122.39, 38.35], [-122.39, 38.36],
                  [-122.40, 38.36], [-122.40, 38.35]
              ]]
          }
          try:
              response = requests.post(
                  base + "/ndvi/area-timeseries",
                  json={"geometry": geometry, "days": 30, "interval": "P30D"},
                  timeout=90,
              )
              print("Copernicus NDVI processing probe HTTP:", response.status_code)
              if response.ok:
                  data = response.json()
                  print("Copernicus NDVI processing status:", data.get("status", "unknown"))
                  series = data.get("series", [])
                  print("Copernicus time-series samples:", len(series) if isinstance(series, list) else "not reported")
                  if data.get("error_type"):
                      print("Copernicus error type:", data.get("error_type"))
              else:
                  print("Copernicus NDVI probe returned a non-success response; response body omitted.")
          except (requests.RequestException, ValueError) as exc:
              print("Copernicus NDVI probe failed:", type(exc).__name__)
          weather_url = "https://api.open-meteo.com/v1/forecast"
          try:
              weather = requests.get(weather_url, params={
                  "latitude": 41.6771, "longitude": 26.5557,
                  "current": "temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation",
                  "timezone": "Europe/Istanbul",
              }, timeout=20)
              print("Open-Meteo weather HTTP:", weather.status_code)
              if weather.ok:
                  current = weather.json().get("current", {})
                  print("Open-Meteo current observation time:", current.get("time", "not reported"))
                  print("Open-Meteo temperature field present:", current.get("temperature_2m") is not None)
              else:
                  print("Open-Meteo weather unavailable; response body omitted.")
          except (requests.RequestException, ValueError) as exc:
              print("Open-Meteo weather probe failed:", type(exc).__name__)

          try:
              from datetime import datetime, timedelta, timezone
              day = (datetime.now(timezone.utc) - timedelta(days=1)).date().isoformat()
              gibs = requests.get("https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi", params={
                  "SERVICE": "WMS", "REQUEST": "GetMap", "VERSION": "1.1.1",
                  "LAYERS": "MODIS_Terra_CorrectedReflectance_TrueColor",
                  "SRS": "EPSG:4326", "BBOX": "26.0,40.0,29.0,42.0",
                  "WIDTH": 256, "HEIGHT": 256, "FORMAT": "image/jpeg",
                  "TIME": day,
              }, timeout=30)
              print("NASA GIBS satellite tile HTTP:", gibs.status_code)
              print("NASA GIBS content type:", gibs.headers.get("content-type", "not reported"))
              print("NASA GIBS response bytes:", len(gibs.content) if gibs.ok else "not available")
          except requests.RequestException as exc:
              print("NASA GIBS tile probe failed:", type(exc).__name__)
          PY

  deployed-ml-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Railway service health without requiring a removed AGPL detector
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = "https://nexorawildfire-ml-production.up.railway.app"
          request = urllib.request.Request(base + "/health", headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              health = json.load(response)
          if health.get("status") != "healthy":
              raise SystemExit(f"ML service is not healthy: {health}")
          print("Railway ML service health: healthy")
          print("Fire/smoke inference remains intentionally disabled until a license-compatible model is validated.")
          PY
