name: Validate NexoraWildfire AI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile backend Python sources
        run: python -m compileall -q backend/app backend/scripts
      - name: Run fail-closed ML tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
