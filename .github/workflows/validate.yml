name: Validate NexoraWildfire AI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and ML dependencies
        run: python -m pip install --upgrade pip pytest requests scikit-learn joblib
      - name: Train research model from the official UCI dataset
        run: python backend/scripts/train_uci_research_model.py
      - name: Compile backend Python sources
        run: python -m compileall -q backend/app backend/scripts
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit the first reproducible research-model artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git ls-files --error-unmatch backend/models/uci_fire_weather_rf.joblib >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/models/uci_fire_weather_rf.joblib backend/models/uci_fire_weather_rf_metadata.json
            git commit -m "ml: add reproducible UCI fire-weather research model"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          else
            echo "Research model artifact is already versioned; no generated binary update is needed."
          fi
