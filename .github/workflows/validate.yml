name: Validate NexoraWildfire AI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and ML dependencies
        run: python -m pip install --upgrade pip -r backend/requirements.txt pytest httpx
      - name: Train research model from the official UCI dataset
        run: python backend/scripts/train_uci_research_model.py
      - name: Compile backend Python sources
        run: python -m compileall -q backend/app backend/scripts
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium test runner
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Test bilingual controls, mobile menu, desktop menu, and install lifecycle
        run: python tests/e2e/test_mobile_ui.py

  provider-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP client
        run: python -m pip install --upgrade requests
      - name: Probe preview provider credentials without exposing secrets
        env:
          NEXORA_PROVIDER_TEST_API_BASE: ${{ vars.NEXORA_PROVIDER_TEST_API_BASE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          base = os.getenv("NEXORA_PROVIDER_TEST_API_BASE", "").strip().rstrip("/")
          bypass_secret = os.getenv("VERCEL_AUTOMATION_BYPASS_SECRET", "").strip()
          if not base.startswith("https://"):
              print("Provider preview API base is missing. Set the GitHub Actions variable NEXORA_PROVIDER_TEST_API_BASE to the preview API URL ending in /api.")
              raise SystemExit(1)
          session = requests.Session()
          if bypass_secret:
              session.headers.update({"x-vercel-protection-bypass": bypass_secret})
          provider_failures = []

          try:
              health = session.get(base + "/health", timeout=20)
              print("Preview backend health HTTP:", health.status_code)
              if not health.ok:
                  print("Backend health endpoint did not return success; provider results are unverified.")
                  raise SystemExit(1)
          except requests.RequestException as exc:
              print("Preview backend unavailable:", type(exc).__name__)
              raise SystemExit(1)

          try:
              live_response = session.get(base + "/satellite/live-check", timeout=75)
              print("Preview live provider diagnostic HTTP:", live_response.status_code)
              if live_response.ok:
                  live = live_response.json()
                  firms = live.get("nasa_firms", {})
                  catalog = live.get("sentinel2_catalog", {})
                  processing = live.get("sentinel2_processing", {})
                  print("NASA FIRMS status:", firms.get("status", "unknown"))
                  print("NASA FIRMS observations returned:", firms.get("alert_count", "not reported"))
                  print("Copernicus STAC catalog:", catalog.get("status", "unknown"))
                  print("Copernicus credential configuration:", processing.get("status", "unknown"))
                  if firms.get("status") != "available":
                      provider_failures.append("NASA FIRMS is not available with a live response")
                  if catalog.get("status") != "scene_found":
                      provider_failures.append("Copernicus STAC scene discovery did not find a matching scene")
                  if processing.get("status") != "credentials_configured":
                      provider_failures.append("Copernicus processing credentials are not configured")
              else:
                  print("Live provider diagnostic returned a non-success response; no credentials or response body were printed.")
                  provider_failures.append("Live provider diagnostic endpoint returned a non-success response")
          except (requests.RequestException, ValueError) as exc:
              print("Live provider diagnostic failed:", type(exc).__name__)
              provider_failures.append("Live provider diagnostic request failed")

          probes = {
              "Thrace, Türkiye": (True, [[26.55, 41.67], [26.56, 41.67], [26.56, 41.68], [26.55, 41.68], [26.55, 41.67]]),
              "California, North America": (False, [[-122.40, 38.35], [-122.39, 38.35], [-122.39, 38.36], [-122.40, 38.36], [-122.40, 38.35]]),
              "Queensland, Australia": (False, [[153.02, -27.47], [153.03, -27.47], [153.03, -27.46], [153.02, -27.46], [153.02, -27.47]]),
          }
          for region, (required, ring) in probes.items():
              geometry = {"type": "Polygon", "coordinates": [ring]}
              try:
                  response = session.post(
                      base + "/ndvi/area-timeseries",
                      json={"geometry": geometry, "days": 90, "interval": "P30D"},
                      timeout=90,
                  )
                  print(region, "NDVI probe HTTP:", response.status_code)
                  if response.ok:
                      data = response.json()
                      series = data.get("series", [])
                      sample_count = len(series) if isinstance(series, list) else 0
                      provider_status = data.get("status", "unknown")
                      print(region, "NDVI status:", provider_status, "samples:", sample_count)
                      if required and (provider_status != "available" or sample_count == 0):
                          provider_failures.append(region + " did not return verified NDVI samples")
                      elif not required and (provider_status != "available" or sample_count == 0):
                          print(region, "is informational only; no global-coverage claim is permitted without verified samples.")
                  elif required:
                      print(region, "required NDVI probe returned a non-success response; response body omitted.")
                      provider_failures.append(region + " NDVI endpoint returned a non-success response")
                  else:
                      print(region, "optional regional probe unavailable; no global-coverage claim is permitted.")
              except (requests.RequestException, ValueError) as exc:
                  if required:
                      print(region, "required NDVI probe failed:", type(exc).__name__)
                      provider_failures.append(region + " NDVI request failed")
                  else:
                      print(region, "optional regional probe unavailable:", type(exc).__name__)

          if provider_failures:
              print("LIVE PROVIDER GATE FAILED:")
              for failure in provider_failures:
                  print("-", failure)
              raise SystemExit(1)
          print("LIVE PROVIDER GATE PASSED: required live data providers and NDVI samples were verified.")
          PY
