name: Daily environmental history snapshots

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexorawildfire-daily-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate server-only credentials
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Configure SUPABASE_URL in Actions secrets."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Configure SUPABASE_SERVICE_ROLE_KEY in Actions secrets. Never put it in frontend code."; exit 1; }
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Save daily weather snapshots for cloud-synced areas
        run: python backend/scripts/daily_environment_snapshots.py
